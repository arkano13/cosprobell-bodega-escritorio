# Arma el instalador de Windows en una máquina Windows de GitHub, lo prueba y lo deja para descargar.
# Con una etiqueta vX.Y.Z (por ejemplo v1.0.1) además publica la versión en "Releases" junto con latest.yml: las
# apps instaladas la encuentran ahí (a través del backend) y se actualizan solas.
name: Instalador de Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # La clave de solo ingreso viaja dentro de la app. Sin el secreto, la app arma igual pero no puede ingresar;
      # para publicar una versión oficial (etiqueta vX.Y.Z) el secreto es obligatorio.
      - name: Clave de ingreso
        shell: bash
        env:
          CLAVE: ${{ secrets.BODEGA_CLAVE_INGRESO }}
        run: |
          if [ -z "$CLAVE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::Falta el secreto BODEGA_CLAVE_INGRESO"; exit 1; fi
            echo "::warning::Falta el secreto BODEGA_CLAVE_INGRESO: esta versión no podrá ingresar"
          fi
          mkdir -p recursos
          node -e 'require("fs").writeFileSync("recursos/clave-ingreso.json", JSON.stringify({ clave: process.env.CLAVE || null }))'
      - name: Armar instalador
        run: npm run dist
        env:
          # Sin certificado de firma de código: el instalador sale sin firmar.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Prueba rápida del programa armado
        run: node test/humo.mjs "dist/win-unpacked/Bodega Cosprobell.exe"
      # latest.yml dice a las apps instaladas cuál es la versión nueva y cómo comprobar el instalador. Con una etiqueta,
      # la etiqueta tiene que ser la versión de package.json.
      - name: Revisar latest.yml
        shell: bash
        run: node test/revisar-latest.mjs dist "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
          path: dist
      # Sirve igual si la versión se creó desde "Releases" en GitHub o solo con la etiqueta.
      - name: Publicar versión
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Bodega Cosprobell $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
